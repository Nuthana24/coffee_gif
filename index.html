<!DOCTYPE html>
<html>
<head>
  <title>Hot Coffee ☕</title>

  <!-- WhatsApp Preview -->
  <meta property="og:title" content="Have a hot coffee ☕">
  <meta property="og:description" content="A little surprise for you ☕🎁">
  <meta property="og:image" content="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif">
  <meta property="og:type" content="website">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #000000, #1a1a1a);
      font-family: Arial, sans-serif;
      color: white;
    }

    h1 {
      font-size: 40px;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #ff9900; }
      to { text-shadow: 0 0 25px #ffcc00; }
    }

    img {
      width: 280px;
      margin-top: 30px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255,165,0,0.6);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0); }
    }

    /* POPUP */
    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .popup-content {
      background: #1a1a1a;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 20px orange;
      animation: pop 0.5s ease;
    }

    @keyframes pop {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: orange;
      color: black;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>☕ Have a Hot Coffee</h1>
  <p>Made just for you with some Nescafe coffee powder! Enjoy.❤️</p>

  <img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif">

  <!-- POPUP -->
  <div class="popup" id="popup">
    <div class="popup-content">
      <h2>🎁 Surprise!</h2>
      <p>kidding, This coffee is specially for nam Ranju ge ☕❤️</p>
      <button onclick="closePopup()">Aww ❤️</button>
    </div>
  </div>

  <script>
    // Show popup after 2 seconds
    setTimeout(() => {
      document.getElementById("popup").style.display = "flex";
    }, 2000);

    function closePopup() {
      document.getElementById("popup").style.display = "none";
    }
  </script>

</body>
</html>
